spring.application.name=MediQueue

# Neon PostgreSQL database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT keystore
mediqueue.jwt.keystore-path=/tmp/jwt-keystore.p12
mediqueue.jwt.keystore-password=${JWT_KEYSTORE_PASSWORD}

# Websites allowed to call this API (comma separated, no trailing slash)
mediqueue.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Keep resource usage small on free plans
spring.datasource.hikari.maximum-pool-size=3
server.tomcat.threads.max=10

# Server port
server.port=${PORT:10000}